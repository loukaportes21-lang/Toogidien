<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toogidien</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --panel:#ffffff; --panel2:#f3f1ec; --line:#e6e2d8;
  --ink:#1d1a18; --ink-dim:#847c6f; --amber:#e08a3c; --red:#d9573c;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:sans-serif; background:var(--bg); color:var(--ink); min-height:100%;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
.app{max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}
header{position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--line);
  padding:calc(14px + env(safe-area-inset-top,0px)) 16px 18px; display:flex; align-items:center; justify-content:space-between;}
.logo{font-family:'Luckiest Guy',cursive; font-size:25px; letter-spacing:1px; color:#fff; -webkit-text-stroke:2px #1d1a18; text-stroke:2px #1d1a18; transform:rotate(-3deg); display:inline-block;
  text-shadow:
    2px 2px 0 #1d1a18,
    3px 3px 0 #4fc3e0, 4px 4px 0 #4fc3e0,
    5px 5px 0 #e85da0, 6px 6px 0 #e85da0,
    7px 7px 0 #f2c230, 8px 8px 0 #f2c230,
    9px 9px 0 #f2994a, 10px 10px 0 #f2994a,
    11px 11px 0 #eb5757, 12px 12px 0 #eb5757;
}
.icon-btn{background:none; border:none; color:var(--ink); font-size:34px; cursor:pointer; line-height:1; padding:4px;}
.icon-btn svg{width:34px; height:34px; display:block;
  filter: drop-shadow(1.5px 1.5px 0 #1d1a18) drop-shadow(1px 1px 0 #4fc3e0) drop-shadow(2px 2px 0 #e85da0) drop-shadow(3px 3px 0 #f2c230) drop-shadow(4px 4px 0 #f2994a);
}
.pico{width:27px; height:27px; display:block;
  filter: drop-shadow(1.2px 1.2px 0 #1d1a18) drop-shadow(1px 1px 0 #4fc3e0) drop-shadow(1.8px 1.8px 0 #e85da0) drop-shadow(2.6px 2.6px 0 #f2c230);
}
.carousel{display:flex; overflow-x:auto; scroll-snap-type:x mandatory; width:100%; height:100%; -webkit-overflow-scrolling:touch;}
.carousel::-webkit-scrollbar{display:none;}
.carousel .slide{flex:0 0 100%; scroll-snap-align:start; position:relative;}
.carousel .slide img,.carousel .slide video{width:100%; height:100%; object-fit:cover;}
.post-overlay-layer{position:absolute; inset:0; pointer-events:none;}
#boot{padding:40px 16px; font-size:13px; color:var(--ink-dim); text-align:center;}
main{flex:1; overflow-y:auto; position:relative; display:none;}
main.ready{display:block;}
.view{display:none;}
.view.active{display:block; animation:slideInR .26s ease;}
.view.active.slide-back{animation:slideInL .26s ease;}
@keyframes slideInR{from{opacity:0; transform:translateX(28px);} to{opacity:1; transform:translateX(0);}}
@keyframes slideInL{from{opacity:0; transform:translateX(-28px);} to{opacity:1; transform:translateX(0);}}
.stories{display:flex; gap:16px; padding:16px; overflow-x:auto; border-bottom:1px solid var(--line);}
.story{display:flex; flex-direction:column; align-items:center; gap:6px; flex-shrink:0; width:80px;}
.ring{width:76px; height:76px; border-radius:50%; padding:3px; background:conic-gradient(from 210deg,var(--amber),var(--red),var(--amber)); position:relative; cursor:pointer;}
.ring img{width:100%; height:100%; border-radius:50%; border:2px solid var(--bg); object-fit:cover;}
.ring.empty{background:var(--line);}
.ring .plus{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:30px; color:var(--ink-dim); background:var(--panel2); border-radius:50%; border:2px solid var(--bg);}
.story-viewer{position:fixed; inset:0; background:#000; z-index:60; display:none; flex-direction:column;}
.story-viewer.open{display:flex;}
#storyMedia{flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden;}
#storyMedia img,#storyMedia video{max-width:100%; max-height:100%;}
.sv-close{position:absolute; top:calc(14px + env(safe-area-inset-top,0px)); right:14px; background:#0007; border:none; color:#fff; width:50px; height:50px; border-radius:50%; font-size:22px; z-index:2; cursor:pointer;}
.sv-delete{position:absolute; top:calc(14px + env(safe-area-inset-top,0px)); right:72px; background:#0007; border:none; color:#fff; height:50px; padding:0 16px; border-radius:25px; font-size:15px; z-index:2; cursor:pointer; white-space:nowrap;}
.sv-info{position:absolute; top:calc(14px + env(safe-area-inset-top,0px)); left:14px; color:#fff; font-size:12px; display:flex; align-items:center; gap:8px; z-index:2; text-shadow:0 1px 4px #0008;}
.sv-info img{width:26px; height:26px; border-radius:50%; object-fit:cover;}
.story span{font-size:11px; color:var(--ink-dim); width:100%; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.reco{font-size:10px; letter-spacing:.5px; color:var(--amber); padding:12px 16px 0;}
.post{border-bottom:1px solid var(--line); padding-bottom:12px;}
.post-head{display:flex; align-items:center; gap:9px; padding:12px 16px;}
.avatar{width:32px; height:32px; border-radius:50%; object-fit:cover; flex-shrink:0; background:var(--panel2);}
.uname{font-size:13px; font-weight:bold;}
.badge{font-size:9px; color:var(--amber); border:1px solid var(--amber); border-radius:8px; padding:1px 6px; margin-left:6px;}
.follow-btn{margin-left:auto; font-size:15px; background:none; border:1px solid var(--line); color:var(--ink-dim); border-radius:18px; padding:10px 18px; cursor:pointer;}
.trash-btn{margin-left:auto; background:none; border:none; color:var(--ink-dim); font-size:26px; cursor:pointer; padding:6px;}
.follow-btn.on{color:var(--amber); border-color:var(--amber);}
.media{width:100%; aspect-ratio:1; position:relative; background:var(--panel2); overflow:hidden;}
.media img,.media video{width:100%; height:100%; object-fit:cover;}
.actions{display:flex; gap:16px; padding:10px 16px 4px; font-size:20px; align-items:center;}
.actions button{background:none; border:none; color:var(--ink); cursor:pointer; font-size:34px; padding:4px;}
.actions button.on{color:var(--red);} .actions button.save-on{color:var(--amber);}
.meta{padding:4px 16px 0; font-size:12px; color:var(--ink-dim);}
.caption{padding:4px 16px 0; font-size:13px; line-height:1.5;}
#view-video{height:calc(100vh - 128px); overflow-y:scroll; scroll-snap-type:y mandatory;}
.reel{height:calc(100vh - 128px); scroll-snap-align:start; position:relative; display:flex; align-items:flex-end; background:var(--panel2);}
.reel video,.reel img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
.reel-bar{position:absolute; right:12px; bottom:110px; display:flex; flex-direction:column; gap:18px; align-items:center; z-index:2;}
.reel-bar button{background:none; border:none; color:#fff; cursor:pointer; display:flex; flex-direction:column; gap:2px; align-items:center;}
.reel-bar button span{font-size:10px; color:#fffc;}
.reel-menu-btn{position:absolute; top:calc(12px + env(safe-area-inset-top,0px)); right:12px; z-index:3; background:#0007; border:none; color:#fff; width:34px; height:34px; border-radius:50%; font-size:20px; cursor:pointer;}
.reel-menu{position:absolute; top:calc(50px + env(safe-area-inset-top,0px)); right:12px; z-index:3; background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; display:none; min-width:140px;}
.reel-menu.open{display:block;}
.reel-menu button{display:block; width:100%; text-align:left; background:none; border:none; color:var(--ink); padding:12px 14px; font-size:13px; cursor:pointer;}
.reel-info{padding:16px 70px 26px 16px; color:#fff; text-shadow:0 1px 4px #0008; position:relative; z-index:2; width:100%;}
.reel-user-row{display:flex; align-items:center; gap:10px;}
.reel-avatar{width:44px; height:44px; border-radius:50%; object-fit:cover; border:2px solid #fff8;}
.reel-sep{width:40px; height:1px; background:#fff6; margin:10px 0 8px;}
.reel-info p{font-size:13px; opacity:.95; line-height:1.4;}
.profile-head{padding:22px 16px 6px; text-align:center;}
.profile-head .avatar{width:80px; height:80px; margin:0 auto 10px;}
.profile-head h2{font-family:Georgia,serif; font-size:19px;}
.stats{display:flex; justify-content:center; gap:26px; margin:14px 0;}
.stats div{text-align:center;} .stats b{display:block; font-size:15px;} .stats span{font-size:10px; color:var(--ink-dim);}
.swatch-row{display:flex; gap:8px; justify-content:center; margin-bottom:16px;}
.swatch{width:40px; height:40px; border-radius:50%; cursor:pointer; border:2px solid transparent;}
.swatch.sel{border-color:var(--ink);}
.grid{display:grid; grid-template-columns:repeat(3,1fr); gap:2px; padding:2px;}
.grid .cell{aspect-ratio:1; background:var(--panel2); overflow:hidden;}
.grid .cell img,.grid .cell video{width:100%; height:100%; object-fit:cover;}
.section-title{font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--ink-dim); padding:16px 16px 8px;}
.opt-list{border-top:1px solid var(--line);}
.opt-row{display:flex; justify-content:space-between; align-items:center; padding:13px 16px; border-bottom:1px solid var(--line); font-size:13px; cursor:pointer;}
.opt-row.admin{color:var(--amber);}
#tree-wrap{position:relative; height:calc(100vh - 128px); overflow:auto; touch-action:none;}
#tree-svg{position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;}
.node{position:absolute; width:64px; margin-left:-32px; margin-top:-32px; text-align:center;}
.node.draggable{cursor:grab;}
.node .avatar{width:52px; height:52px; margin:0 auto 4px; border:2px solid var(--bg); box-shadow:0 0 0 1px var(--line);}
.node .n{font-size:10px; font-weight:bold; line-height:1.2;}
.node .r{font-size:9px; color:var(--amber);}
.tree-hint{padding:10px 16px; font-size:11px; color:var(--ink-dim); border-bottom:1px solid var(--line);}
.conv{display:flex; gap:11px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); cursor:pointer;}
.conv .prev{font-size:12px; color:var(--ink-dim); margin-top:2px;}
.locked{padding:16px; font-size:12px; color:var(--ink-dim); text-align:center;}
#chat-view{display:none; position:absolute; inset:0; background:var(--bg); flex-direction:column; z-index:5;}
#chat-view.open{display:flex;}
.chat-head{display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line);}
.chat-head button{background:none; border:none; font-size:18px; color:var(--ink); cursor:pointer;}
.chat-body{flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:8px;}
.bubble{max-width:75%; padding:9px 12px; border-radius:14px; font-size:13px;}
.bubble.them{background:var(--panel2); align-self:flex-start;} .bubble.me{background:var(--amber); color:#1a1512; align-self:flex-end;}
.chat-input{display:flex; gap:8px; padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px)); border-top:1px solid var(--line);}
.chat-input input{flex:1; background:var(--panel2); border:1px solid var(--line); border-radius:20px; padding:9px 14px; color:var(--ink); font-size:13px;}
.chat-input button{background:var(--amber); border:none; border-radius:50%; width:52px; height:52px; font-size:20px; color:#1a1512; font-weight:bold; cursor:pointer;}
nav{display:flex; justify-content:space-around; align-items:center; padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--line); background:var(--bg); position:sticky; bottom:0; z-index:20;}
nav button{background:none; border:none; cursor:pointer; padding:8px 10px; opacity:.6; transition:transform .15s ease, opacity .15s ease; display:flex; align-items:center; justify-content:center;}
nav button svg{width:29px; height:29px; display:block;
  filter:
    drop-shadow(1.5px 1.5px 0 #1d1a18)
    drop-shadow(1px 1px 0 #4fc3e0)
    drop-shadow(2px 2px 0 #e85da0)
    drop-shadow(3px 3px 0 #f2c230)
    drop-shadow(4px 4px 0 #f2994a);
}
nav button.active{opacity:1; transform:scale(1.18) rotate(-5deg);}
.modal-bg{position:fixed; inset:0; background:#000a; z-index:50; display:none; align-items:flex-end;}
.modal-bg.open{display:flex;}
.modal{background:var(--panel); width:100%; max-width:480px; margin:0 auto; border-radius:18px 18px 0 0;
  padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px)); max-height:80vh; overflow-y:auto;}
.modal h3{font-family:Georgia,serif; font-size:17px; margin-bottom:14px;}
.filepick{display:flex; align-items:center; gap:10px; background:var(--panel2); border:1px dashed var(--line); border-radius:10px; padding:10px; margin-bottom:12px; font-size:12px; color:var(--ink-dim);}
.type-toggle{display:flex; gap:8px; margin-bottom:14px;}
.dur-btn{flex:1; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--panel2); color:var(--ink); font-size:13px; cursor:pointer;}
.dur-btn.sel{background:var(--amber); border-color:var(--amber); color:#1a1512; font-weight:bold;}
.filepick input{font-size:11px;}
.swatches{display:flex; gap:9px; margin-bottom:14px;}
.modal textarea{width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:10px; color:var(--ink); padding:10px 12px; font-size:13px; height:56px; resize:none;}
.modal-actions{display:flex; gap:10px; margin-top:14px;}
.modal-actions button{flex:1; padding:18px; border-radius:12px; border:1px solid var(--line); font-size:16px; cursor:pointer; background:var(--panel2); color:var(--ink);}
.modal-actions .post-btn{background:var(--amber); border-color:var(--amber); color:#1a1512; font-weight:bold;}
.source-options{display:flex; gap:10px; margin-bottom:6px;}
.source-opt{flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; background:var(--panel2); border:1px solid var(--line); border-radius:14px; padding:16px 6px; font-size:12px; color:var(--ink); cursor:pointer;}
.source-opt span:first-child{font-size:28px;}
.story-editor{position:fixed; inset:0; background:#000; z-index:70; display:none; flex-direction:column;}
.story-editor.open{display:flex;}
#editorMediaWrap{flex:1; position:relative; overflow:hidden; background:#111;}
#editorMediaWrap img,#editorMediaWrap video{width:100%; height:100%; object-fit:contain; position:absolute; inset:0;}
#drawLayer{position:absolute; inset:0; width:100%; height:100%; touch-action:none;}
#overlayLayer{position:absolute; inset:0;}
.ov-item{position:absolute; transform:translate(-50%,-50%); cursor:grab; touch-action:none; user-select:none;}
.ov-item .ov-del{position:absolute; top:-10px; right:-10px; width:20px; height:20px; background:#d9573c; color:#fff; border-radius:50%; font-size:11px; display:flex; align-items:center; justify-content:center; border:2px solid #000;}
.ov-item.text-item{color:#fff; font-size:20px; font-weight:bold; text-shadow:0 1px 5px #000a; padding:4px 10px; white-space:nowrap;}
.ov-item.sticker-item{font-size:38px;}
.editor-top{position:absolute; top:calc(12px + env(safe-area-inset-top,0px)); left:0; right:0; display:flex; justify-content:flex-start; align-items:center; padding:0 14px; z-index:5;}
.editor-top button{background:#0007; border:none; color:#fff; width:38px; height:38px; border-radius:50%; font-size:16px; cursor:pointer;}
.editor-right-tools{position:absolute; top:50%; right:12px; transform:translateY(-50%); display:flex; flex-direction:column; gap:14px; z-index:5;}
.editor-right-tools button{background:#0007; border:none; color:#fff; width:42px; height:42px; border-radius:50%; font-size:18px; cursor:pointer;}
.editor-right-tools button.on{background:var(--amber); color:#1a1512;}
.editor-panel{position:absolute; left:0; right:0; bottom:190px; padding:10px 14px; display:none; gap:8px; background:#000a; z-index:4; align-items:center; flex-wrap:wrap;}
.editor-panel.show{display:flex;}
.color-dot{width:30px; height:30px; border-radius:50%; border:2px solid #fff5; cursor:pointer;}
.color-dot.sel{border-color:#fff;}
#textPanel input{flex:1; background:#fff2; border:1px solid #fff5; border-radius:20px; padding:10px 14px; color:#fff; font-size:14px;}
#textPanel button{background:var(--amber); border:none; color:#1a1512; border-radius:20px; padding:10px 16px; font-weight:bold; cursor:pointer;}
.sticker-opt{font-size:26px; cursor:pointer; padding:4px;}
.editor-bottom{background:var(--panel); padding:12px 14px calc(16px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:10px;}
.pill-row{display:flex; gap:7px; overflow-x:auto;}
.pill{flex-shrink:0; background:var(--panel2); border:1px solid var(--line); color:var(--ink); border-radius:16px; padding:8px 13px; font-size:12px; cursor:pointer;}
.pill.sel{background:var(--amber); color:#1a1512; border-color:var(--amber);}
.admin-row{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);}
.admin-row select{background:var(--panel2); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:4px; margin-left:auto;}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">Toogidien</div>
    <div style="display:flex; gap:10px; align-items:center;">
      <span id="whoami" style="font-size:10px; color:var(--ink-dim);"></span>
      <button class="icon-btn" onclick="openPostSource()"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="7" fill="#fff" stroke="#1d1a18" stroke-width="2"/><path d="M12 7.5v9M7.5 12h9" stroke="#1d1a18" stroke-width="2.2" stroke-linecap="round"/></svg></button>
    </div>
  </header>
  <div id="boot">Connexion à Toogidien…</div>
  <main id="main">
    <section class="view active" id="view-home">
      <div class="stories" id="stories"></div>
      <div id="feed"></div>
    </section>
    <section class="view" id="view-video"></section>
    <section class="view" id="view-tree">
      <div class="tree-hint" id="treeHint"></div>
      <div id="tree-wrap"><svg id="tree-svg"></svg></div>
    </section>
    <section class="view" id="view-messages">
      <div id="convList"></div>
      <div id="chat-view">
        <div class="chat-head"><button onclick="closeChat()">←</button>
          <img class="avatar" id="chatAvatar" style="width:30px;height:30px;">
          <div class="uname" id="chatName"></div></div>
        <div class="chat-body" id="chatBody"></div>
        <div class="chat-input"><input id="chatInput" placeholder="Message…" onkeydown="if(event.key==='Enter')sendMsg()">
          <button onclick="sendMsg()">➤</button></div>
      </div>
    </section>
    <section class="view" id="view-profile">
      <div class="profile-head">
        <img class="avatar" id="myAvatar">
        <h2 id="myName">…</h2>
        <div class="stats">
          <div><b id="pcount">0</b><span>posts</span></div>
          <div><b id="followerCount">0</b><span>abonnés</span></div>
          <div><b id="followingCount">0</b><span>suivis</span></div>
        </div>
        <div class="swatch-row" id="myColor"></div>
      </div>
      <div class="section-title">Publications</div>
      <div class="grid" id="myGrid"></div>
      <div class="section-title">Options</div>
      <div class="opt-list">
        <div class="opt-row"><span>Modifier le profil</span><span>›</span></div>
        <div class="opt-row"><span>Confidentialité</span><span>›</span></div>
        <div class="opt-row"><span>Notifications</span><span>›</span></div>
        <div class="opt-row admin" id="adminRow" onclick="openAdmin()"><span>Page admin</span><span>›</span></div>
        <div class="opt-row"><span>Se déconnecter</span><span>›</span></div>
      </div>
    </section>
  </main>
  <nav id="nav">
    <button class="active" data-v="home" onclick="switchView('home')"><svg viewBox="0 0 24 24"><path d="M4 11.5L12 4l8 7.5" stroke="#1d1a18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="#fff"/><path d="M6 10.5V19a1 1 0 0 0 1 1h3v-5a2 2 0 1 1 4 0v5h3a1 1 0 0 0 1-1v-8.5" stroke="#1d1a18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="#fff"/></svg></button>
    <button data-v="profile" onclick="switchView('profile')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#fff" stroke="#1d1a18" stroke-width="2"/><circle cx="9" cy="10.3" r="1.3" fill="#1d1a18"/><circle cx="15" cy="10.3" r="1.3" fill="#1d1a18"/><path d="M8 14.2c1 1.4 2.5 2.2 4 2.2s3-.8 4-2.2" stroke="#1d1a18" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg></button>
    <button data-v="video" onclick="switchView('video')"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="6" fill="#fff" stroke="#1d1a18" stroke-width="2"/><path d="M10 8.3v7.4l6.2-3.7z" fill="#1d1a18" stroke="#1d1a18" stroke-width="1" stroke-linejoin="round"/></svg></button>
    <button data-v="tree" onclick="switchView('tree')"><svg viewBox="0 0 24 24"><path d="M12 7.6v3.4M12 11 6 15.5M12 11l6 4.5" stroke="#1d1a18" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="5" r="2.6" fill="#fff" stroke="#1d1a18" stroke-width="1.8"/><circle cx="6" cy="18" r="2.6" fill="#fff" stroke="#1d1a18" stroke-width="1.8"/><circle cx="18" cy="18" r="2.6" fill="#fff" stroke="#1d1a18" stroke-width="1.8"/></svg></button>

<script>
const G = ['#e08a3c','#6b7a5e','#3c5e70','#8a5a44','#c9a15c','#4a3b52'];
let db,assets,user,myId,amOwner,ownerId=null;
let posts=[], profilesMap={}, rolesMap={}, followsMap={}, treePos={}, storiesMap={};
let uploadedAsset=null, postMode='post', storyDurationH=24;

async function boot(){
  const claudeApi = window.claude;
  if(!claudeApi){ document.getElementById('boot').textContent = "Cette page doit être ouverte depuis claude.ai pour fonctionner (accès aux données partagées)."; return; }
  db = await claudeApi.use('db');
  assets = await claudeApi.use('assets');
  user = await claudeApi.use('user');
  if(!db || !user){ document.getElementById('boot').textContent = "Impossible de se connecter aux données partagées ici — ouvre cet artefact depuis claude.ai."; return; }
  myId = await user.id();
  amOwner = await user.isOwner();
  if(!myId){ document.getElementById('boot').textContent = "Connecte-toi à claude.ai pour utiliser Toogidien."; return; }

  // meta/owner
  if(amOwner){
    const m = await db.doc('meta/owner').get();
    if(!m.exists || m.data().uid!==myId) await db.doc('meta/owner').set({uid:myId});
  }
  db.doc('meta/owner').onSnapshot(s=>{ ownerId = s.exists ? s.data().uid : null; renderAll(); });

  // my profile registration
  const p = await db.doc('profiles/'+myId).get();
  if(!p.exists) await db.doc('profiles/'+myId).set({color:G[0], bio:''});
  // my role registration (skip for owner)
  if(!amOwner){
    const r = await db.doc('roles/'+myId).get();
    if(!r.exists) await db.doc('roles/'+myId).set({role:'Membre'});
  }
  // my follow doc
  const f = await db.doc('follows/'+myId).get();
  if(!f.exists) await db.doc('follows/'+myId).set({following:[]});

  db.collection('profiles').onSnapshot(s=>{ profilesMap={}; s.docs.forEach(d=>profilesMap[d.id]=d.data()); renderAll(); });
  db.collection('roles').onSnapshot(s=>{ rolesMap={}; s.docs.forEach(d=>rolesMap[d.id]=d.data()); renderAll(); });
  db.collection('follows').onSnapshot(s=>{ followsMap={}; s.docs.forEach(d=>followsMap[d.id]=d.data()); renderAll(); });
  db.doc('tree/layout').onSnapshot(s=>{ treePos = s.exists ? (s.data().positions||{}) : {}; if(document.getElementById('view-tree').classList.contains('active')) renderTree(); });
  db.collection('posts').orderBy('createdAt','desc').limit(40).onSnapshot(s=>{ posts = s.docs.map(d=>({id:d.id,...d.data()})); renderAll(); });
  db.collection('stories').onSnapshot(s=>{
    storiesMap={}; s.docs.forEach(d=>storiesMap[d.id]=d.data());
    renderStories();
    cleanupExpiredStories();
  });

  const me = await user.me();
  document.getElementById('whoami').textContent = amOwner ? 'Admin · '+(me.name||'toi') : (me.name||'toi');
  document.getElementById('boot').style.display='none';
  document.getElementById('main').classList.add('ready');
  renderStories();
  setInterval(()=>{ renderStories(); cleanupExpiredStories(); }, 60000);
}

function role(uid){ return uid===ownerId ? 'Admin' : (rolesMap[uid]?.role || 'Membre'); }
function myFollowing(){ return followsMap[myId]?.following || []; }
function isMutual(uid){ const mine=myFollowing(); const theirs=followsMap[uid]?.following||[]; return mine.includes(uid) && theirs.includes(myId); }

async function avatarFor(uid){ const ps = await user.profiles([uid]); return ps[uid]; }

function toast(msg){
  let t=document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast';
    t.style.cssText='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1a1512e6;color:#fff;padding:11px 18px;border-radius:22px;font-size:13px;z-index:999;max-width:85%;text-align:center;transition:opacity .2s;';
    document.body.appendChild(t);
  }
  t.textContent=msg; t.style.opacity='1';
  clearTimeout(t._h); t._h=setTimeout(()=>{ t.style.opacity='0'; }, 2800);
}

function renderAll(){
  renderFeed(); 
  if(document.getElementById('view-video').classList.contains('active')) renderReels();
  if(document.getElementById('view-tree').classList.contains('active')) renderTree();
  if(document.getElementById('view-messages').classList.contains('active')) renderConvs();
  if(document.getElementById('view-profile').classList.contains('active')) renderProfile();
}

function storyExpiresAt(s){ return s.expiresAt || (s.createdAt + 24*3600*1000); }
function storyActive(uid){ const s=storiesMap[uid]; return !!(s && s.assetUrl && Date.now() < storyExpiresAt(s)); }
function cleanupExpiredStories(){
  Object.keys(storiesMap).forEach(uid=>{
    const s = storiesMap[uid];
    if(s && Date.now() >= storyExpiresAt(s) && (uid===myId || amOwner)){
      db.doc('stories/'+uid).delete().catch(()=>{});
      if(s.assetId) assets.delete(s.assetId).catch(()=>{});
    }
  });
}

async function renderStories(){
  const ids = Object.keys(profilesMap);
  const profs = await user.profiles(ids);
  const hasStory = storyActive(myId);
  const others = ids.filter(id=>id!==myId && storyActive(id));
  let html = `<div class="story" onclick="${hasStory?`viewStory('${myId}')`:`openStorySource()`}">
    <div class="ring${hasStory?'':' empty'}">${hasStory?`<img src="${profs[myId]?.avatarUrl||''}">`:'<span class="plus">+</span>'}</div>
    <span>Ta story</span></div>`;
  html += others.map(id=>`<div class="story" onclick="viewStory('${id}')"><div class="ring"><img src="${profs[id]?.avatarUrl||''}"></div><span>${profs[id]?.name||'Membre'}</span></div>`).join('');
  document.getElementById('stories').innerHTML = html;
}

async function viewStory(uid){
  const s = storiesMap[uid];
  if(!s || !storyActive(uid)){ if(uid===myId) openStorySource(); return; }
  const prof = await avatarFor(uid);
  document.getElementById('storyInfo').innerHTML = `<img src="${prof.avatarUrl||''}"><span>${uid===myId?'Ta story':(prof.name||'Membre')}</span>${s.music&&MUSIC_PRESETS[s.music]?' <span style="opacity:.8">'+MUSIC_PRESETS[s.music].label+'</span>':''}`;
  const ov = s.overlay || {draws:[],texts:[],stickers:[]};
  const drawSvgHtml = (ov.draws||[]).map(d=>`<polyline points="${d.pts}" fill="none" stroke="${d.color}" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`).join('');
  const itemsHtml = [
    ...(ov.texts||[]).map(t=>`<div class="ov-item text-item" style="left:${t.x}%;top:${t.y}%;">${(t.text||'').replace(/</g,'&lt;')}</div>`),
    ...(ov.stickers||[]).map(st=>`<div class="ov-item sticker-item" style="left:${st.x}%;top:${st.y}%;">${st.emoji}</div>`)
  ].join('');
  document.getElementById('storyMedia').innerHTML = `<div style="position:relative;width:100%;height:100%;">
    ${s.type==='video' ? `<video id="storyVidEl" src="${s.assetUrl}" autoplay muted playsinline style="width:100%;height:100%;object-fit:contain;"></video>` : `<img src="${s.assetUrl}" style="width:100%;height:100%;object-fit:contain;">`}
    <svg style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;">${drawSvgHtml}</svg>
    <div style="position:absolute;inset:0;pointer-events:none;">${itemsHtml}</div>
  </div>`;
  const delBtn = document.getElementById('storyDeleteBtn');
  const canDel = uid===myId || amOwner;
  delBtn.style.display = canDel ? 'block' : 'none';
  delBtn.textContent = '🗑 Supprimer';
  delBtn.onclick = ()=>deleteStory(uid, s.assetId, delBtn);
  stopMusicLoop();
  if(s.music) playMusicLoop(s.music);
  clearTimeout(storyAutoTimer);
  if(s.type==='video'){
    const v = document.getElementById('storyVidEl');
    v.onended = closeStory;
  } else {
    storyAutoTimer = setTimeout(closeStory, (s.viewSec||5)*1000);
  }
  document.getElementById('storyViewer').classList.add('open');
}
function closeStory(){ stopMusicLoop(); clearTimeout(storyAutoTimer); document.getElementById('storyViewer').classList.remove('open'); document.getElementById('storyMedia').innerHTML=''; }
async function deleteStory(uid, assetId, btnEl){
  const key = 'story_'+uid;
  if(!pendingDelete.has(key)){
    pendingDelete.add(key);
    if(btnEl) btnEl.textContent='✓ Confirmer';
    toast('Retouche pour confirmer la suppression');
    setTimeout(()=>{ pendingDelete.delete(key); if(btnEl && btnEl.isConnected) btnEl.textContent='🗑 Supprimer'; }, 3000);
    return;
  }
  pendingDelete.delete(key);
  await db.doc('stories/'+uid).delete();
  if(assetId){ assets.delete(assetId).catch(()=>{}); }
  closeStory();
}

function normalizeMedia(p){
  if(p.media && p.media.length) return p.media;
  if(p.assetUrl) return [{type:p.type||'photo', assetUrl:p.assetUrl, assetId:p.assetId}];
  return [];
}
function heartSvg(on){ return `<svg viewBox="0 0 24 24" class="pico"><path d="M12 20.5s-7.2-4.5-9.6-9.2A5.6 5.6 0 0 1 12 6a5.6 5.6 0 0 1 9.6 5.3c-2.4 4.7-9.6 9.2-9.6 9.2z" fill="${on?'#eb5757':'#fff'}" stroke="#1d1a18" stroke-width="1.8" stroke-linejoin="round"/></svg>`; }
function bookmarkSvg(on){ return `<svg viewBox="0 0 24 24" class="pico"><path d="M6 3.5h12a1 1 0 0 1 1 1V21l-7-4.2L5 21V4.5a1 1 0 0 1 1-1z" fill="${on?'#e08a3c':'#fff'}" stroke="#1d1a18" stroke-width="1.8" stroke-linejoin="round"/></svg>`; }
function commentSvg(){ return `<svg viewBox="0 0 24 24" class="pico"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7a2.5 2.5 0 0 1-2.5 2.5H10l-4.5 4v-4H6.5A2.5 2.5 0 0 1 4 13.5v-7z" fill="#fff" stroke="#1d1a18" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>`; }
function musicNoteSvg(){ return `<svg viewBox="0 0 24 24" class="pico" style="width:22px;height:22px;"><path d="M9 18V5l10-2v13" stroke="#1d1a18" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.5" fill="#fff" stroke="#1d1a18" stroke-width="1.8"/><circle cx="16.5" cy="16" r="2.5" fill="#fff" stroke="#1d1a18" stroke-width="1.8"/></svg>`; }

async function renderFeed(){
  const el = document.getElementById('feed');
  if(!posts.length){ el.innerHTML = '<div style="margin:20px 16px; padding:32px 20px; font-size:17px; line-height:1.5; color:var(--ink-dim); text-align:center; background:var(--panel2); border:1px solid var(--line); border-radius:18px;">Aucune publication pour l\u2019instant. Touche ✚ pour lancer le fil.</div>'; return; }
  const ids = [...new Set(posts.map(p=>p.uid))];
  const profs = await user.profiles(ids);
  el.innerHTML = posts.map(p=>{
    const prof = profs[p.uid] || {name:'',avatarUrl:''};
    const liked = (p.likes||[]).includes(myId);
    const saved = (p.saved||[]).includes(myId);
    const reco = p.uid!==myId && !myFollowing().includes(p.uid);
    const canDelete = p.uid===myId || amOwner;
    const media = normalizeMedia(p);
    const ov = p.overlay || {draws:[],texts:[],stickers:[]};
    const drawSvgHtml = (ov.draws||[]).map(d=>`<polyline points="${d.pts}" fill="none" stroke="${d.color}" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`).join('');
    const itemsHtml = [
      ...(ov.texts||[]).map(t=>`<div class="ov-item text-item" style="left:${t.x}%;top:${t.y}%;">${(t.text||'').replace(/</g,'&lt;')}</div>`),
      ...(ov.stickers||[]).map(st=>`<div class="ov-item sticker-item" style="left:${st.x}%;top:${st.y}%;">${st.emoji}</div>`)
    ].join('');
    const hasOverlay = (ov.draws&&ov.draws.length) || (ov.texts&&ov.texts.length) || (ov.stickers&&ov.stickers.length);
    const overlayHtml = hasOverlay ? `<svg class="post-overlay-layer">${drawSvgHtml}</svg><div class="post-overlay-layer">${itemsHtml}</div>` : '';
    let mediaHtml;
    if(p.kind==='text'){
      mediaHtml = `<div style="width:100%;height:100%;background:${p.colorFallback||G[0]};display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:#fff;font-weight:bold;font-size:20px;font-family:Georgia,serif;">${(p.caption||'').replace(/</g,'&lt;')}</div>`;
    } else if(media.length>1){
      mediaHtml = `<div class="carousel">${media.map(m=>`<div class="slide">${m.type==='video'?`<video src="${m.assetUrl}" muted loop playsinline controls></video>`:`<img src="${m.assetUrl}">`}</div>`).join('')}</div>${overlayHtml}`;
    } else if(media.length===1){
      mediaHtml = (media[0].type==='video'?`<video src="${media[0].assetUrl}" muted loop playsinline controls></video>`:`<img src="${media[0].assetUrl}">`) + overlayHtml;
    } else {
      mediaHtml = `<div style="width:100%;height:100%;background:${p.colorFallback||G[0]}"></div>`;
    }
    const assetIds = media.map(m=>m.assetId).filter(Boolean).join(',');
    return `<article class="post">
      <div class="post-head">
        <img class="avatar" src="${prof.avatarUrl}">
        <div><div class="uname">${p.uid===myId?'toi':(prof.name||'Membre')}${p.uid===ownerId?'<span class=\"badge\">Admin</span>':''}</div></div>
        ${p.uid!==myId?`<button class="follow-btn ${myFollowing().includes(p.uid)?'on':''}" onclick="toggleFollow('${p.uid}')">${myFollowing().includes(p.uid)?'Suivi':'Suivre'}</button>`:''}
        ${canDelete?`<button class="trash-btn" onclick="deletePost('${p.id}','${assetIds}', this)">🗑</button>`:''}
      </div>
      <div class="media">${mediaHtml}</div>
      <div class="actions">
        <button onclick="toggleLike('${p.id}')">${heartSvg(liked)}</button>
        <button onclick="toast('Commentaires — pas encore dans cette version.')">${commentSvg()}</button>
        <button onclick="toggleSave('${p.id}')">${bookmarkSvg(saved)}</button>
        ${p.music&&MUSIC_PRESETS[p.music]?`<button onclick="previewMusic('${p.music}')">${musicNoteSvg()}</button>`:''}
        ${reco?'<span style="margin-left:auto;font-size:10px;color:var(--ink-dim);">Recommandé</span>':''}
      </div>
      <div class="meta">${(p.likes||[]).length} mentions J\u2019aime</div>
      ${p.kind!=='text'?`<div class="caption"><b>${p.uid===myId?'toi':(prof.name||'Membre')}</b> ${p.caption||''}</div>`:''}
    </article>`;
  }).join('');
}

async function renderReels(){
  const vids = posts.map(p=>({p, vid:normalizeMedia(p).find(m=>m.type==='video')})).filter(x=>x.vid);
  const ids=[...new Set(vids.map(x=>x.p.uid))];
  const profs = await user.profiles(ids);
  document.getElementById('view-video').innerHTML = vids.length ? vids.map(({p,vid})=>{

  let lines='';
  ids.forEach((id,i)=>{ if(id!==ownerId){ const pos = treePos[id] || fallbackPos(i,ids.length);
    lines += `<line x1="${rootPos[0]}%" y1="${rootPos[1]}%" x2="${pos[0]}%" y2="${pos[1]}%" stroke="var(--line)" stroke-width="2"/>`; }});
  svg.innerHTML = lines;
  wrap.querySelectorAll('.node').forEach(n=>n.remove());
  ids.forEach((id,i)=>{

function fallbackPos(i,total){ const cols=Math.max(1,total-1||1); return [15 + (i*70/cols), 60]; }
function enableDrag(node,uid){

  node.addEventListener('pointerup', ()=>{ if(dragging){ dragging=false; savePositions(); }});
  node.addEventListener('pointermove', e=>{
    if(!dragging) return;

    let x=(e.clientX-r.left)/r.width*100, y=(e.clientY-r.top+wrap.scrollTop)/wrap.scrollHeight*100;
    x=Math.max(4,Math.min(96,x)); y=Math.max(4,Math.min(96,y));
    treePos[uid]=[x,y]; node.style.left=x+'%'; node.style.top=y+'%';
  });
}

const MUSIC_PRESETS = {

  storyDraft.music=id;

  if(id) previewMusic(id);
}
function ensureAudio(){ if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return audioCtx; }
function previewMusic(id){
  const ctx = ensureAudio(); if(!ctx) return;
  const notes = MUSIC_PRESETS[id].notes; const t0 = ctx.currentTime;
  notes.forEach((f,i)=>{
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.value=f; o.connect(g); g.connect(ctx.destination);
    const start=t0+i*0.22;
    g.gain.setValueAtTime(0,start); g.gain.linearRampToValueAtTime(0.12,start+0.02); g.gain.linearRampToValueAtTime(0,start+0.2);
    o.start(start); o.stop(start+0.22);
  });
}
function playMusicLoop(id){
  stopMusicLoop();
  const ctx = ensureAudio(); if(!ctx || !MUSIC_PRESETS[id]) return;
  previewMusic(id);
  musicTimer = setInterval(()=>previewMusic(id), 900);
}
function stopMusicLoop(){ if(musicTimer){ clearInterval(musicTimer); musicTimer=null; } }

// drawing
const drawSvg = ()=>document.getElementById('drawLayer');
function svgPoint(e){
  const r = drawSvg().getBoundingClientRect();
  return [((e.clientX-r.left)/r.width*100).toFixed(2), ((e.clientY-r.top)/r.height*100).toFixed(2)];
}
document.addEventListener('pointerdown', e=>{
  if(editorTool!=='draw' || !e.target.closest('#editorMediaWrap') || e.target.closest('.editor-top,.editor-panel')) return;
  const [x,y] = svgPoint(e);
  curStroke = document.createElementNS('http://www.w3.org/2000/svg','polyline');
  curStroke.setAttribute('points', `${x},${y}`);
  curStroke.setAttribute('fill','none'); curStroke.setAttribute('stroke',drawColor);
  curStroke.setAttribute('stroke-width','1.2'); curStroke.setAttribute('stroke-linecap','round'); curStroke.setAttribute('stroke-linejoin','round');
  curStroke.setAttribute('vector-effect','non-scaling-stroke');
  drawSvg().appendChild(curStroke);
});
document.addEventListener('pointermove', e=>{
  if(!curStroke) return;
  const [x,y] = svgPoint(e);
  curStroke.setAttribute('points', curStroke.getAttribute('points')+` ${x},${y}`);
});
document.addEventListener('pointerup', ()=>{
  if(curStroke){ storyDraft?.draws.push({pts:curStroke.getAttribute('points'), color:drawColor}); curStroke=null; }
});
function undoStroke(){
  if(!storyDraft) return;
  storyDraft.draws.pop();
  const svg = drawSvg(); if(svg.lastElementChild) svg.removeChild(svg.lastElementChild);
}

function addTextOverlay(){
  const inp = document.getElementById('textInputBox'); const text = inp.value.trim();
  if(!text) return;
  storyDraft.texts.push({text, x:50, y:50});
  renderOverlayItem('text-item', text, 50, 50, storyDraft.texts[storyDraft.texts.length-1], storyDraft.texts, 'overlayLayer', 'editorMediaWrap');
  inp.value='';
}
function addSticker(emoji){
  storyDraft.stickers.push({emoji, x:50, y:50});
  renderOverlayItem('sticker-item', emoji, 50, 50, storyDraft.stickers[storyDraft.stickers.length-1], storyDraft.stickers, 'overlayLayer', 'editorMediaWrap');
}
function renderOverlayItem(cls, content, x, y, dataRef, arr, layerId, wrapId){
  const el = document.createElement('div');
  el.className = 'ov-item '+cls;
  el.style.left=x+'%'; el.style.top=y+'%';
  el.innerHTML = content + '<div class="ov-del">✕</div>';
  el.querySelector('.ov-del').onclick = ev=>{
    ev.stopPropagation();
    const idx = arr.indexOf(dataRef); if(idx>-1) arr.splice(idx,1);
    el.remove();
  };
  let dragging=false;
  el.addEventListener('pointerdown', e=>{ dragging=true; el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointerup', ()=>dragging=false);
  el.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const r = document.getElementById(wrapId).getBoundingClientRect();
    const x = Math.max(2,Math.min(98,(e.clientX-r.left)/r.width*100));
    const y = Math.max(2,Math.min(98,(e.clientY-r.top)/r.height*100));
    el.style.left=x+'%'; el.style.top=y+'%'; dataRef.x=x; dataRef.y=y;
  });
  document.getElementById('overlayLayer').appendChild(el);
}

function setPostTool(tool){
  postTool=tool;
  ['Draw','Text','Sticker'].forEach(t=>document.getElementById('pTool'+t).classList.toggle('on', t.toLowerCase()===tool));
  document.getElementById('postDrawPanel').classList.toggle('show', tool==='draw');
  document.getElementById('postTextPanel').classList.toggle('show', tool==='text');
  document.getElementById('postStickerPanel').classList.toggle('show', tool==='sticker');
}
function setPostDrawColor(c,el){ postDrawColor=c; document.querySelectorAll('#postDrawPanel .color-dot').forEach(d=>d.classList.remove('sel')); el.classList.add('sel'); }
function setPostMusic(id,el){
  postDraft.music=id;
  document.querySelectorAll('#postMusicRow .pill').forEach(p=>p.classList.remove('sel')); el.classList.add('sel');
  if(id) previewMusic(id);
}

const postDrawSvg = ()=>document.getElementById('postDrawLayer');
function postSvgPoint(e){ const r=postDrawSvg().getBoundingClientRect(); return [((e.clientX-r.left)/r.width*100).toFixed(2), ((e.clientY-r.top)/r.height*100).toFixed(2)]; }
document.addEventListener('pointerdown', e=>{
  if(postTool!=='draw' || !postDraft || postDraft.kind!=='media' || !e.target.closest('#postEditorMediaWrap') || e.target.closest('.editor-top,.editor-panel')) return;
  const [x,y]=postSvgPoint(e);
  postCurStroke=document.createElementNS('http://www.w3.org/2000/svg','polyline');
  postCurStroke.setAttribute('points',`${x},${y}`);
  postCurStroke.setAttribute('fill','none'); postCurStroke.setAttribute('stroke',postDrawColor);
  postCurStroke.setAttribute('stroke-width','1.2'); postCurStroke.setAttribute('stroke-linecap','round'); postCurStroke.setAttribute('stroke-linejoin','round');
  postCurStroke.setAttribute('vector-effect','non-scaling-stroke');
  postDrawSvg().appendChild(postCurStroke);
});
document.addEventListener('pointermove', e=>{ if(!postCurStroke) return; const [x,y]=postSvgPoint(e); postCurStroke.setAttribute('points', postCurStroke.getAttribute('points')+` ${x},${y}`); });
document.addEventListener('pointerup', ()=>{ if(postCurStroke){ postDraft?.draws.push({pts:postCurStroke.getAttribute('points'), color:postDrawColor}); postCurStroke=null; } });
function undoPostStroke(){ if(!postDraft) return; postDraft.draws.pop(); const svg=postDrawSvg(); if(svg.lastElementChild) svg.removeChild(svg.lastElementChild); }

function addPostTextOverlay(){
  const inp=document.getElementById('postTextInputBox'); const text=inp.value.trim(); if(!text) return;
  postDraft.texts.push({text,x:50,y:50});
  renderOverlayItem('text-item', text, 50, 50, postDraft.texts[postDraft.texts.length-1], postDraft.texts, 'postOverlayLayer', 'postEditorMediaWrap');
  inp.value='';
}
function addPostSticker(emoji){
  postDraft.stickers.push({emoji,x:50,y:50});
  renderOverlayItem('sticker-item', emoji, 50, 50, postDraft.stickers[postDraft.stickers.length-1], postDraft.stickers, 'postOverlayLayer', 'postEditorMediaWrap');
}

function closePostEditor(){
  document.getElementById('postEditor').classList.remove('open');
  if(postDraft?.previewUrl) URL.revokeObjectURL(postDraft.previewUrl);
  const vid=document.getElementById('postEditorVideo'); vid.pause(); vid.src='';
  postDraft=null;
}
async function publishPost(){
  if(!postDraft) return;
  const btn=document.getElementById('postPublishBtn'); btn.textContent='Publication…'; btn.disabled=true;
  const caption = document.getElementById('postCaptionInput').value.trim();
  let media=[];
  if(postDraft.kind==='media'){
    try{
      for(const f of postDraft.mediaFiles){
        const res = await assets.upload(f);
        media.push({type: f.type.startsWith('video')?'video':'photo', assetUrl:res.url, assetId:res.id});
      }
    }catch(e){ toast('Envoi impossible : '+(e.message||e.code||'erreur')); btn.textContent='Publier'; btn.disabled=false; return; }
  }
  await db.collection('posts').add({
    uid:myId, kind:postDraft.kind, media,
    colorFallback: postDraft.kind==='text' ? G[postBgIdx] : null,
    caption: caption || (postDraft.kind==='text' ? '' : 'Sans légende.'),
    music: postDraft.music,
    overlay:{draws:postDraft.draws, texts:postDraft.texts, stickers:postDraft.stickers},
    likes:[], saved:[], createdAt:Date.now()
  });
  toast('Publication ajoutée');
  closePostEditor(); switchView('home');
  btn.textContent='Publier'; btn.disabled=false;
}

async function openAdmin(){
  const ids = Object.keys(profilesMap).filter(id=>id!==ownerId);
  const profs = await user.profiles(ids);
  document.getElementById('adminList').innerHTML = ids.length ? ids.map(id=>`
    <div class="admin-row"><img class="avatar" style="width:28px;height:28px;" src="${profs[id]?.avatarUrl||''}">
      <span>${profs[id]?.name||'Membre'}</span>
      <select onchange="changeRole('${id}',this.value)">
        ${['Membre','Modératrice','Modérateur'].map(r=>`<option ${(rolesMap[id]?.role||'Membre')===r?'selected':''}>${r}</option>`).join('')}
      </select>
    </div>`).join('') : '<div style="padding:12px 0; color:var(--ink-dim);">Personne d\u2019autre n\u2019a encore ouvert Toogidien.</div>';
  document.getElementById('adminModal').classList.add('open');
}
async function changeRole(uid, role){ await db.doc('roles/'+uid).set({role}); }

boot();
</script>
